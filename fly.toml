app = 'akgui-bot'
primary_region = 'nrt'

# 스왑 512MB. 비용은 안 들어요.
#
# ⚠️ 이 줄은 반드시 **첫 테이블 선언([build] 등)보다 위**에 있어야 해요. TOML은 테이블 선언
# 뒤에 나온 키를 그 테이블 소속으로 봐요. 처음에 [[restart]] 아래에 뒀다가 restart 테이블의
# 키가 돼버려서 Fly가 통째로 무시했고, 배포해도 SwapTotal이 0이었어요.
#
# 왜 필요한가: 2026-09-06에 프로덕션 /proc/meminfo를 재보니 노래방을 안 쓰는 idle 상태에서도
# 여유가 68MB뿐이고 스왑이 0이었어요. 스왑이 없으면 메모리가 모자랄 때 커널이 프로세스를 죽이는
# 대신 **실행 중인 코드 페이지를 축출**해서 버텨요. 그러면 그 페이지를 디스크에서 매번 다시 읽느라
# 봇이 죽지도 않으면서 기어가는 상태가 되는데, 2026-09-04에 겪은 "머신은 started인데 로그가
# 37분간 무음" 증상이 정확히 이거예요(OOM 이벤트도 재시작도 없었던 이유).
#
# 스왑이 있으면 코드 대신 스왑으로 밀어내니 느려질지언정 먹통까지는 안 가요.
#
# 2026-10-17에 아래 [[vm]]을 512MB로 올렸어요. 그래도 스왑은 그대로 둬요 — 스왑이 안전망이고
# 공짜라서, 빼면 2026-09-04의 "먹통" 증상으로 돌아갈 길이 다시 열려요.
swap_size_mb = 512

[build]

[[mounts]]
  source = 'bot_data'
  destination = '/app/data'

# bot.py의 워치독이 이벤트 루프 멈춤을 감지하면 exit(1)로 죽어요.
# 그때 Fly가 다시 띄워줘야 자동 복구가 완성돼요. (현재 머신 기본값과 동일하지만,
# 나중에 누가 모르고 바꾸지 않도록 명시해둬요.)
[[restart]]
  policy = 'on-failure'
  retries = 10

[[vm]]
  # 2026-10-17: 256mb → 512mb. 왜 올렸나 —
  # v123을 3시간 20분 연속 관측했더니 여유 RAM은 10~46MB에서 진동만 하는데(= 누수가 아니라
  # 상주량 자체가 256MB를 넘는다) **스왑 여유가 434MB → 368MB로 시간당 약 20MB씩 단조 감소**했어요.
  # 그 속도면 17~18시간 뒤 스왑 512MB까지 소진돼서, 그동안은 배포가 사실상 재시작 역할을 해준
  # 셈이었어요. 재측정은 `flyctl logs | grep 🩺` (bot.py가 10분마다 남겨요).
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
