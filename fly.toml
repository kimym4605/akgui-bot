app = 'akgui-bot'
primary_region = 'nrt'

[build]

[[mounts]]
  source = 'bot_data'
  destination = '/app/data'

# bot.py의 워치독이 이벤트 루프 멈춤을 감지하면 exit(1)로 죽어요.
# 그때 Fly가 다시 띄워줘야 자동 복구가 완성돼요. (현재 머신 기본값과 동일하지만,
# 나중에 누가 모르고 바꾸지 않도록 명시해둬요.)
[[restart]]
  policy = 'on-failure'
  retries = 10

# 스왑을 512MB 붙여요. 비용은 안 들어요.
#
# 2026-09-06에 프로덕션 /proc/meminfo를 재보니, 노래방을 안 쓰는 idle 상태인데도 여유가
# 68MB뿐이고 스왑은 0이었어요. 스왑이 없으면 메모리가 모자랄 때 커널이 프로세스를 죽이는 대신
# **실행 중인 코드 페이지를 축출**해서 버텨요. 그러면 그 페이지를 디스크에서 매번 다시 읽느라
# 봇이 죽지도 않으면서 기어가는 상태가 되는데, 이게 2026-09-04에 겪은 "머신은 started인데
# 로그가 37분간 무음" 증상과 정확히 맞아요(OOM 이벤트도, 재시작도 없었던 이유).
#
# 스왑이 있으면 그 상황에서 코드 대신 스왑으로 밀어내니, 느려질지언정 먹통까지는 안 가요.
# 근본 해결은 메모리를 512MB로 올리는 거예요(월 $1.25 정도 추가).
swap_size_mb = 512

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
