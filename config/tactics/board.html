<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>악귀봇 작전판</title>
<style>
  :root {
    --bg: #0e1018; --panel: #171a26; --panel2: #1f2333; --line: #2a2f42; --text: #e8e9f0; --soft: #9aa0b5;
    --ally: #4fc3f7; --enemy: #ff4655; --pick: #f5c518;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  button, input { font: inherit; color: var(--text); }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: #3a4260; }
  button.on { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick) inset; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .top h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  #title { width: 220px; }
  .grow { flex: 1; }
  #status { color: var(--soft); font-size: 12px; }
  #who { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
          background: var(--panel2); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr) 260px; gap: 12px; padding: 12px; max-width: 1500px; margin: 0 auto; }
  .view .wrap { grid-template-columns: minmax(0, 1fr) 280px; }
  @media (max-width: 1100px) { .wrap, .view .wrap { grid-template-columns: 1fr; } .mapcol { order: -1; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .card h2 { font-size: 13px; color: var(--soft); margin: 2px 0 8px; font-weight: 600; }
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
  .agents button { padding: 2px; aspect-ratio: 1; border-radius: 10px; }
  .agents img { width: 100%; height: 100%; display: block; border-radius: 8px; }
  .abil { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .abil button { display: flex; align-items: center; gap: 6px; text-align: left; padding: 6px; }
  .abil img { width: 26px; height: 26px; background: #000; border-radius: 6px; padding: 2px; flex: none; }
  .abil .k { font-weight: 800; color: var(--pick); width: 14px; flex: none; }
  .abil .n { font-size: 12px; line-height: 1.25; }
  .sel-agent { display: flex; align-items: center; gap: 8px; margin: 10px 0 8px; font-weight: 700; }
  .sel-agent img { width: 34px; height: 34px; border-radius: 8px; }
  .scenes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .scenes button.sc { min-width: 36px; font-weight: 700; }
  #scene-title { width: 180px; }
  .mapbox { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #0a0c12;
            border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; transform-origin: 0 0; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; pointer-events: none; -webkit-user-drag: none; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .zoom button { width: 36px; height: 36px; padding: 0; background: rgba(23,26,38,.85); font-size: 18px; }
  .hint { color: var(--soft); font-size: 12px; margin-top: 6px; }
  .opts { display: flex; gap: 12px; color: var(--soft); font-size: 13px; margin-top: 6px; flex-wrap: wrap; }
  .list .g { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-weight: 700; }
  .list .g img { width: 22px; height: 22px; border-radius: 6px; }
  .list .a { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--soft); padding-left: 28px; }
  .list .a img { width: 16px; height: 16px; background: #000; border-radius: 4px; }
  .note { display: flex; gap: 6px; align-items: flex-start; padding: 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .note:hover, .note.on { background: var(--panel2); }
  .note .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--pick); color: #111;
               font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .note .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .note .who { color: var(--soft); font-size: 12px; }
  .note button { padding: 0 6px; font-size: 12px; flex: none; }
  #err { padding: 40px 16px; color: var(--soft); }
  .view .edit-only { display: none !important; }
  .edit .view-only { display: none !important; }
  body:not(.owner) .owner-only { display: none !important; }
  body:not(.noter) .noter-only { display: none !important; }
  .team-ally.on { border-color: var(--ally); box-shadow: 0 0 0 1px var(--ally) inset; }
  .team-enemy.on { border-color: var(--enemy); box-shadow: 0 0 0 1px var(--enemy) inset; }
  @keyframes ping { from { transform: scale(.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.4s ease-out forwards; pointer-events: none; }
  @media (pointer: coarse) {
    button { padding: 10px 12px; }
    .agents { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
    .abil img { width: 32px; height: 32px; }
    .zoom button { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div id="err" hidden></div>
<div id="root" hidden>
  <div class="top">
    <h1 id="mapname">🗺️</h1>
    <input type="text" id="title" class="edit-only" maxlength="40" placeholder="제목">
    <span id="title-view" class="view-only" style="font-weight:700"></span>
    <button id="side" class="edit-only" title="공격/수비 표시">⚔️ 공격</button>
    <span id="side-view" class="view-only" style="color:var(--soft)"></span>
    <span id="who"></span>
    <span class="grow"></span>
    <span id="status"></span>
    <button id="save" class="edit-only">💾 저장</button>
    <button id="share" class="edit-only">👀 보기 링크 복사</button>
    <button id="invite" class="owner-only" title="디스코드 채널에 초대 글을 올려요. 버튼을 누른 사람은 12시간 동안 같이 그릴 수 있어요.">👥 같이 그리기 초대</button>
    <button id="post" class="owner-only" title="장면마다 그림을 올리고 서버 작전 모음에 실어요">📤 디스코드에 올리기</button>
  </div>
  <div class="wrap">
    <aside class="card edit-only">
      <div class="row">
        <button id="team-ally" class="team-ally on">🔵 아군</button>
        <button id="team-enemy" class="team-enemy">🔴 적군</button>
      </div>
      <div class="row" id="roles"></div>
      <div class="agents" id="agents"></div>
      <div id="agent-panel" hidden>
        <div class="sel-agent"><img id="sa-icon" alt=""><span id="sa-name"></span></div>
        <div class="abil" id="abil"></div>
      </div>
      <h2 style="margin-top:12px">도구</h2>
      <div class="row">
        <button id="t-select" class="on">🖐️ 선택·이동</button>
        <button id="t-arrow">➡️ 화살표</button>
        <button id="t-text">🔤 글</button>
        <button id="t-ruler">📏 거리</button>
      </div>
      <div class="row">
        <button id="t-note" title="맵에 피드백 메모를 꽂아요">💬 피드백 핀</button>
        <button id="t-ping" title="같이 보는 사람들에게 그 자리를 깜빡여요">📍 핑</button>
      </div>
      <div class="row">
        <button id="undo">↩️ 되돌리기</button>
        <button id="del" disabled>🗑️ 지우기</button>
        <button id="clear">장면 비우기</button>
      </div>
      <div class="hint" id="tool-hint">요원을 고르고 스킬을 누른 뒤 맵을 누르세요.</div>
    </aside>
    <main class="mapcol">
      <div class="scenes">
        <span id="scene-tabs" class="scenes" style="margin:0"></span>
        <button id="scene-add" class="edit-only" title="지금 장면을 복사해 다음 장면 만들기">＋ 장면</button>
        <button id="scene-del" class="edit-only">장면 삭제</button>
        <input type="text" id="scene-title" class="edit-only" maxlength="40" placeholder="장면 제목 (예: 진입 전)">
        <span id="scene-title-view" class="view-only" style="color:var(--soft)"></span>
      </div>
      <div class="row noter-only">
        <button id="n-select" class="on">🖐️ 보기</button>
        <button id="n-note">💬 피드백 핀 남기기</button>
        <button id="n-ping">📍 핑</button>
        <span class="hint" id="noter-hint" style="margin:0;align-self:center"></span>
      </div>
      <div class="mapbox" id="mapbox">
        <div id="stage">
          <img id="mini" alt="미니맵" draggable="false">
          <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
              <marker id="ah-ally" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/></marker>
              <marker id="ah-enemy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4655"/></marker>
            </defs>
            <g id="g-callouts"></g>
            <g id="g-items"></g>
            <g id="g-preview"></g>
            <g id="g-cursors" pointer-events="none"></g>
          </svg>
        </div>
        <div class="zoom">
          <button id="z-in" title="확대">＋</button>
          <button id="z-out" title="축소">－</button>
          <button id="z-reset" title="원래대로">⟲</button>
        </div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="opt-callout" checked> 구역 이름</label>
        <label><input type="checkbox" id="opt-notes" checked> 피드백 핀</label>
        <label title="그리는 사람이 장면을 넘기면 내 화면도 따라가요"><input type="checkbox" id="opt-follow"> 장면 따라가기</label>
        <span>원 크기·벽 길이는 실제 비율의 <b>대략값</b>이에요 · 두 손가락/휠로 확대</span>
      </div>
    </main>
    <aside class="side">
      <div class="card list">
        <h2>💬 피드백 <span id="note-count"></span></h2>
        <div id="notes"></div>
      </div>
      <div class="card list">
        <h2>놓인 것</h2>
        <div id="list"></div>
      </div>
    </aside>
  </div>
</div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const parts = location.pathname.split("/").filter(Boolean);
// e 편집 링크(만든 사람) · c 같이 그리기 · f 피드백(메모 핀만) · v 보기
const ROLE = ["e", "v", "c", "f"].includes(parts[0]) ? parts[0] : "v";
const KEY = parts[1] || "", PASS = parts[2] || "";
const CAN_EDIT = ROLE === "e" || ROLE === "c", CAN_NOTE = ROLE !== "v", OWNER = ROLE === "e";
const MODE = CAN_EDIT ? "edit" : "view";
const TAIL = `${ROLE}/${encodeURIComponent(KEY)}${PASS ? "/" + encodeURIComponent(PASS) : ""}`;
const TEAM = { ally: "#4fc3f7", enemy: "#ff4655" };
const FILL = { smoke: { ally: "rgba(150,210,240,.42)", enemy: "rgba(255,140,150,.40)" },
               zone: { ally: "rgba(79,195,247,.20)", enemy: "rgba(255,70,85,.22)" },
               wall: { ally: "rgba(79,195,247,.9)", enemy: "rgba(255,70,85,.9)" } };
const TAP = 0.015;        // 이보다 짧게 끌면 '톡 누름'

let META = null, MAP = null, AG = {}, scenes = [{ sid: "s0", title: "", items: [] }], cur = 0, side = "atk", viewId = "";
let title = "", notes = [], focusedNote = null;
let team = "ally", tool = "select", curAgent = null, curAbility = null, selected = -1;
let undoStack = [], dirty = false, saveTimer = null, drag = null, roleFilter = "", ruler = null;
const Z = { s: 1, x: 0, y: 0 }, pointers = new Map();
let pinch = null;
// 👥 실시간: confirmed = 서버 상태(받은 순서대로 따라감) · unacked = 보냈지만 확인 못 받은 묶음
//           synced = confirmed + unacked (내가 보낸 것까지). 화면 상태와 synced의 차이만 연산으로 보내요.
let ws = null, wsOk = false, wsTry = 0, wsDead = false, synced = null, confirmed = null, seq = 0, unacked = [], stale = false;
// 방금 확인받은 묶음(몇 초치). 서버는 2초 모아서 저장하니, 저장 전에 재시작(배포)하면 확인받은 것도 사라질 수 있어요.
// 다시 붙을 때 끊기기 직전 것들을 한 번 더 보내요(같은 연산은 두 번 와도 결과가 같아요).
let recent = [], lostAt = 0;
let me = null, myBy = "", who = [], viewers = 0, lastCur = 0;
const cursors = new Map();

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const X = (u) => u * 1000, Y = (v) => v * 1000;
const items = () => scenes[cur].items;
const meters = (du) => du / (MAP.unit || 0.007);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const nid = () => Math.random().toString(36).slice(2, 10).padEnd(8, "0");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `오류 ${r.status}`);
  return j;
}

function loadScenes(list) {
  const out = (Array.isArray(list) ? list : []).map((s) => ({
    sid: s.sid || nid(), title: s.title || "",
    items: (s.items || []).map((it) => (it.id ? it : { ...it, id: nid() })) }));
  return out.length ? out : [{ sid: nid(), title: "", items: [] }];
}

async function main() {
  document.body.classList.add(MODE);
  if (OWNER) document.body.classList.add("owner");
  if (CAN_NOTE && !CAN_EDIT) document.body.classList.add("noter");
  try {
    const [meta, board] = await Promise.all([getJSON("/api/meta"), getJSON(`/api/board/${TAIL}`)]);
    META = meta; MAP = meta.maps[board.map];
    if (!MAP) throw new Error("맵 자료가 없어요.");
    for (const a of meta.agents) AG[a.id] = a;
    const data = board.data || {};
    scenes = loadScenes(data.scenes);
    side = data.side || "atk";
    notes = board.notes || [];
    myBy = board.by || "";
    viewId = board.view;
    setTitle(board.title || "", true);
  } catch (e) {
    $("err").hidden = false; $("err").textContent = "⚠️ " + e.message; return;
  }
  $("mapname").textContent = `🗺️ ${MAP.name}`;
  $("mini").src = MAP.minimap;
  $("root").hidden = false;
  $("opt-follow").checked = !CAN_EDIT;
  drawCallouts();
  if (CAN_EDIT) { synced = clone(localState()); confirmed = clone(synced); setupEditor(); }
  if (CAN_NOTE && !CAN_EDIT) setupNoter();
  setupZoom();
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (MODE === "view" || tool === "select") {
      if (e.key === "ArrowRight" && cur < scenes.length - 1) { gotoScene(cur + 1); }
      if (e.key === "ArrowLeft" && cur > 0) { gotoScene(cur - 1); }
    }
  });
  updateSide();
  renderScenes();
  render();
  connect();
  setInterval(() => {      // 멈춘 커서는 5초 뒤 지워요
    const now = Date.now(); let gone = false;
    for (const [c, v] of cursors) if (now - v.at > 5000) { cursors.delete(c); gone = true; }
    if (gone) drawCursors();
  }, 1500);
}

// ---------------------------------------------------------------- 곡선
// 점 목록 → 부드러운 곡선(Catmull-Rom을 베지어로). 좌표는 0~1.
function smoothD(pts) {
  const P = pts.map(([u, v]) => [X(u), Y(v)]);
  if (P.length < 3) return `M${P[0][0]},${P[0][1]} L${P[P.length - 1][0]},${P[P.length - 1][1]}`;
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
// 손떨림 점 줄이기 (Ramer–Douglas–Peucker). eps는 0~1 좌표 기준.
function simplify(pts, eps = 0.003) {
  if (pts.length < 3) return pts;
  const [a, b] = [pts[0], pts[pts.length - 1]];
  let best = -1, idx = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i], dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1e-9;
    const d = Math.abs(dy * p[0] - dx * p[1] + b[0] * a[1] - b[1] * a[0]) / len;
    if (d > best) { best = d; idx = i; }
  }
  if (best <= eps) return [a, b];
  return simplify(pts.slice(0, idx + 1), eps).slice(0, -1).concat(simplify(pts.slice(idx), eps));
}
function finishPts(raw) {
  let pts = simplify(raw.map(([u, v]) => [+u.toFixed(4), +v.toFixed(4)]));
  while (pts.length > 64) pts = pts.filter((_, i) => i % 2 === 0 || i === pts.length - 1);
  return pts;
}
// 점 목록을 길이 max(0~1 좌표)까지만 남겨요(넘는 곳은 그 지점에서 자름).
function clampPath(pts, max) {
  if (!max) return pts;
  const out = [pts[0]]; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = dist(pts[i - 1], pts[i]);
    if (total + seg > max) {
      const t = (max - total) / seg;
      out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
      return out;
    }
    total += seg; out.push(pts[i]);
  }
  return out;
}
function pathLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]); return s; }
// 곧은 벽: 고정 길이면 그 길이로, 최대 길이면 그 안으로. 방향은 끈 방향.
function fitLine(a, b, { fixed = 0, max = 0 } = {}) {
  let dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (len < 1e-6) { dx = 1; dy = 0; len = 1; }
  const want = fixed ? fixed : (max && len > max ? max : len);
  return [a[0] + (dx / len) * want, a[1] + (dy / len) * want];
}
// 사거리: 중심 c에서 r(0~1 좌표) 밖이면 경계로 당겨요.
function clampRange(c, p, r) {
  const d = dist(c, p);
  if (!r || d <= r) return p;

  const bs = new Map(base.scenes.map((s) => [s.sid, s]));
  const ns = new Set(now.scenes.map((s) => s.sid));
  // 지운 장면을 먼저 보내요(장면 10개 한도에 잠깐이라도 안 걸리게). 단, 하나도 안 남으면 새 장면 하나를 넣은 뒤에.

    if (op.t === "meta") { if (op.title != null) st.title = op.title; if (op.side) st.side = op.side; continue; }
    if (op.t === "sadd") {
      if (!op.scene || st.scenes.some((s) => s.sid === op.scene.sid)) continue;
      const i = op.after == null ? -1 : st.scenes.findIndex((s) => s.sid === op.after);
      st.scenes.splice(op.after == null ? 0 : (i < 0 ? st.scenes.length : i + 1), 0, clone(op.scene));
      continue;
    }
    const si = st.scenes.findIndex((s) => s.sid === op.sid);
    if (si < 0) continue;
    const sc = st.scenes[si];
    if (op.t === "sdel") { if (st.scenes.length > 1) st.scenes.splice(si, 1); }

    else if (op.t === "add" || op.t === "upd") {
      const k = sc.items.findIndex((it) => it.id === op.item.id);
      if (k >= 0) sc.items[k] = clone(op.item);
      else if (op.t === "add") sc.items.push(clone(op.item));
    } else if (op.t === "del") {

//   synced = 지금까지 보낸 것까지 반영된 상태 · local = 화면 상태(아직 안 보낸 변경 포함)

}
function tabText(i) {
  const s = scenes[i], n = notes.filter((x) => x.sid === s.sid).length;
  return (s.title ? `${i + 1}. ${s.title}` : `${i + 1}`) + (n ? ` 💬${n}` : "");

// silent = 남을 따라 넘어간 것(다시 알리지 않아요)
function gotoScene(i, silent) {

  $("scene-title").value = scenes[cur].title || "";
  renderScenes(); render();

  if (!silent && wsOk && CAN_EDIT) { flushLive(); wsSend({ t: "at", sid: scenes[cur].sid }); }
}

  $("save").onclick = save;
  $("share").onclick = async () => {

    catch { status(url); }
  };
  $("post").onclick = postToDiscord;
  $("invite").onclick = inviteLive;
  const roles = [["", "전체"]];
  for (const a of META.agents) if (!roles.some((r) => r[0] === a.role)) roles.push([a.role, a.roleName]);
  for (const [k, name] of roles) {

    $("roles").appendChild(b);

// 피드백 링크(f): 보기 화면 + 메모 핀·핑만

function shapeTip(sh) {
  if (!sh) return "";
  if (sh.kind === "path") return ` (끌어서 곡선${sh.max ? ` · 최대 약 ${sh.max}m` : ""})`;
  if (sh.kind === "line") return sh.fixed ? ` (끌어서 방향 · 약 ${sh.fixed}m)` : ` (끌어서 선${sh.max ? ` · 최대 약 ${sh.max}m` : ""})`;
  const rng = sh.range ? ` · 사거리 약 ${sh.range}m` : "";
  if (sh.kind === "circle") return ` (반경 약 ${sh.r}m${rng})`;
  return rng ? ` (${rng.slice(3)})` : "";
}
function renderAbilities() {
  $("agent-panel").hidden = !curAgent;

  mk("요원 놓기", curAgent.icon, "👤", () => setTool("agent"), tool === "agent");
  for (const ab of curAgent.abilities) {

       tool === "ability" && curAbility === ab);

const HINT = {
  select: "놓인 것을 눌러 고르고 끌어서 옮겨요. 빈 곳을 끌면 확대한 맵을 움직여요. ← → 장면 넘기기",
  agent: "맵을 누르면 그 자리에 요원을 놓아요.",
  ability: "톡 누르면 그 자리에 놓고, 끌면 던진 경로(튕김도 그대로)를 그린 뒤 끝에 떨어져요. 벽은 끌어서 그려요.",
  arrow: "끄는 대로 이동 경로가 그려져요(코너를 돌아가도 돼요).",
  text: "맵을 누르면 글을 넣어요(60자까지).",
  ruler: "두 지점을 끌면 실제 거리(m, 대략)를 보여줘요. 저장되지 않아요.",
  note: "맵을 누르면 그 자리에 피드백 메모를 남겨요(120자까지). 보는 사람 모두에게 보여요.",
  ping: "맵을 누르면 같이 보는 사람들 화면에서 그 자리가 깜빡여요.",
};
function setTool(t) {
  tool = t;
  for (const [id, k] of [["t-select", "select"], ["t-arrow", "arrow"], ["t-text", "text"], ["t-ruler", "ruler"],
                         ["t-note", "note"], ["t-ping", "ping"], ["n-select", "select"], ["n-note", "note"], ["n-ping", "ping"]])
    $(id).classList.toggle("on", tool === k);

  const rng = t === "ability" && curAbility && (curAbility.shape || {}).range;
  if (rng) hint = anchorsOf(curAgent.id, team).length
    ? `${curAgent.name}에게서 사거리 약 ${rng}m 안에만 놓여요(노란 점선 원). ` + hint
    : `💡 ${curAgent.name}을(를) 먼저 맵에 놓으면 사거리(약 ${rng}m) 안에서만 놓여요. ` + hint;

function setTeam(t) {

  $("team-ally").classList.toggle("on", t === "ally");
  $("team-enemy").classList.toggle("on", t === "enemy");

}

// 되돌리기: 그때의 장면들을 통째로 기억해요. 남이 바꾼 것은 기억에도 같이 반영해서(applyRemote) 되돌려도 안 사라져요.
function push() { undoStack.push({ scenes: clone(scenes), sid: scenes[cur].sid }); if (undoStack.length > 60) undoStack.shift(); }
function undo() {
  if (!undoStack.length) return;
  const s = undoStack.pop(); scenes = s.scenes;
  const i = scenes.findIndex((x) => x.sid === s.sid); cur = i >= 0 ? i : Math.min(cur, scenes.length - 1);
  selected = -1; renderScenes(); changed(); render();
}
function delSelected() { if (selected < 0) return; push(); items().splice(selected, 1); selected = -1; changed(); render(); }

// ---------------------------------------------------------------- 맵 위 조작 (편집·보기 공통: 확대·이동)
function pt(e) {
  const r = $("svg").getBoundingClientRect();
  return { u: +((e.clientX - r.left) / r.width).toFixed(4), v: +((e.clientY - r.top) / r.height).toFixed(4) };
}
function hitIndex(e) {
  let n = e.target;
  while (n && n !== $("svg")) { if (n.dataset && n.dataset.i != null) return +n.dataset.i; n = n.parentNode; }
  return -1;
}
function applyZoom() {
  const box = $("mapbox").getBoundingClientRect();
  Z.s = Math.min(4, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(box.width - box.width * Z.s, Z.x));
  Z.y = Math.min(0, Math.max(box.height - box.height * Z.s, Z.y));
  $("stage").style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
}
function zoomAt(cx, cy, factor) {
  const box = $("mapbox").getBoundingClientRect();
  const lx = cx - box.left, ly = cy - box.top;
  const ns = Math.min(4, Math.max(1, Z.s * factor));
  Z.x = lx - (lx - Z.x) * (ns / Z.s); Z.y = ly - (ly - Z.y) * (ns / Z.s); Z.s = ns;
  applyZoom();
}
function setupZoom() {
  const box = $("mapbox");
  const center = () => { const r = box.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  $("z-in").onclick = () => zoomAt(...center(), 1.4);
  $("z-out").onclick = () => zoomAt(...center(), 1 / 1.4);
  $("z-reset").onclick = () => { Z.s = 1; Z.x = 0; Z.y = 0; applyZoom(); };
  for (const id of ["z-in", "z-out", "z-reset"]) $(id).addEventListener("pointerdown", (e) => e.stopPropagation());
  box.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  box.addEventListener("pointerdown", onDown);
  box.addEventListener("pointermove", onMove);
  box.addEventListener("pointerup", onUp);
  box.addEventListener("pointercancel", onUp);
  window.addEventListener("resize", applyZoom);
}

function startPinch() {
  const [a, b] = [...pointers.values()];
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: Z.s, x: Z.x, y: Z.y };
  if (drag && drag.kind === "move") { const s = undoStack.pop(); if (s) scenes = s.scenes; }  // 옮기던 건 되돌려요
  drag = null; $("g-preview").innerHTML = ""; render();
  drainRemote();
}

function curShape() { return tool === "arrow" ? { kind: "path" } : ((curAbility || {}).shape || { kind: "icon" }); }
function letGo(e) {       // prompt()는 손 뗀 신호를 삼켜요 → 누른 손가락을 직접 잊어요
  pointers.delete(e.pointerId);
  try { $("mapbox").releasePointerCapture(e.pointerId); } catch { /* 이미 풀림 */ }
}

function onDown(e) {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  $("mapbox").setPointerCapture(e.pointerId);
  if (pointers.size === 2) { startPinch(); return; }
  if (pointers.size > 2) return;
  const p = pt(e), P = [p.u, p.v];
  if (CAN_NOTE && tool === "note") { letGo(e); addNote(P); return; }
  if (CAN_NOTE && tool === "ping") { sendPing(P); return; }
  if (!CAN_EDIT || tool === "select") {
    const note = hitNote(e);
    if (note) { focusNote(note === focusedNote ? null : note); return; }
    const i = CAN_EDIT ? hitIndex(e) : -1;
    if (CAN_EDIT) { selected = i; render(); }
    if (i >= 0) { push(); drag = { kind: "move", start: p, orig: clone(items()[i]), moved: false }; }
    else if (Z.s > 1) drag = { kind: "pan", cx: e.clientX, cy: e.clientY, x: Z.x, y: Z.y };
    return;
  }
  if (tool === "ruler") { drag = { kind: "ruler", a: P }; ruler = { a: P, b: P }; render(); return; }
  if (tool === "agent" && curAgent) {
    push(); items().push({ id: nid(), type: "agent", agent: curAgent.id, team, u: p.u, v: p.v });
    selected = items().length - 1; setTool("select"); changed(); render(); return;
  }
  if (tool === "text") {
    letGo(e);
    const text = (prompt("넣을 글 (60자까지)") || "").trim().slice(0, 60);
    if (text) { push(); items().push({ id: nid(), type: "text", text, team, u: p.u, v: p.v }); changed(); render(); }
    return;
  }
  if (tool === "arrow" || (tool === "ability" && curAbility)) drag = { kind: "draw", start: P, pts: [P] };
}

function onMove(e) {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const box = $("mapbox").getBoundingClientRect();
    const ns = Math.min(4, Math.max(1, pinch.s * d / pinch.d));
    const lx = pinch.mx - box.left, ly = pinch.my - box.top;
    Z.s = ns; Z.x = lx - (lx - pinch.x) * (ns / pinch.s) + (mx - pinch.mx); Z.y = ly - (ly - pinch.y) * (ns / pinch.s) + (my - pinch.my);
    applyZoom(); return;
  }
  const p = pt(e), P = [p.u, p.v];
  sendCursor(P);
  if (!drag) return;
  if (drag.kind === "pan") { Z.x = drag.x + e.clientX - drag.cx; Z.y = drag.y + e.clientY - drag.cy; applyZoom(); return; }
  if (drag.kind === "ruler") { ruler.b = P; render(); return; }
  if (drag.kind === "move") {
    const i = selected, o = drag.orig, du = p.u - drag.start.u, dv = p.v - drag.start.v;
    const it = items()[i];
    if (!it) return;
    if (Math.abs(du) + Math.abs(dv) > 0.002) drag.moved = true;
    it.u = +(o.u + du).toFixed(4); it.v = +(o.v + dv).toFixed(4);
    if (o.u2 != null) { it.u2 = +(o.u2 + du).toFixed(4); it.v2 = +(o.v2 + dv).toFixed(4); }
    if (o.pts) it.pts = o.pts.map(([u, v]) => [+(u + du).toFixed(4), +(v + dv).toFixed(4)]);
    if (it.u2 == null) fitRange(it);     // 옮겨도 요원 사거리 안 (던진 경로는 통째로 옮기니 그대로)
    render(); return;
  }
  const last = drag.pts[drag.pts.length - 1];
  if (dist(P, last) > 0.004) drag.pts.push(P);
  const g = $("g-preview"); g.innerHTML = "";
  const it = newDrawnItem(drag, P, false);
  if (it) {
    drawItem(g, it, -1, true);
    const sh = curShape();
    if (tool === "ability" && (sh.kind === "line" || sh.kind === "path")) {
      const len = it.pts ? pathLen(it.pts) : dist([it.u, it.v], [it.u2, it.v2]);
      const cap = sh.fixed || sh.max;
      label(g, X(it.u2) + 12, Y(it.v2) - 12, `${meters(len).toFixed(0)}m${cap ? ` / ${cap}m` : ""}`);
    }
  }
}

function onUp(e) {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; return; }
  if (!drag) return;
  const d = drag; drag = null; $("g-preview").innerHTML = "";
  if (d.kind === "pan" || d.kind === "ruler") { drainRemote(); return; }
  if (d.kind === "move") { if (d.moved) changed(); else undoStack.pop(); drainRemote(); return; }
  const p = pt(e);
  const it = newDrawnItem(d, [p.u, p.v], true);
  if (it) { push(); items().push(it); changed(); render(); }
  drainRemote();
}

// 끌기 결과 → 항목.
//  - 곧은 벽(line): 고정·최대 길이에 맞춘 두 점   - 휘는 벽·화살표(path): 점 목록(최대 길이까지)
//  - 그 밖의 스킬: 톡 누르면 그 자리, 끌면 던진 경로(pts) + 떨어진 곳(u2,v2)
function newDrawnItem(d, P, final) {
  const sh = curShape();
  const unit = MAP.unit || 0.007;
  const base = tool === "arrow" ? { id: nid(), type: "arrow", team }
    : { id: nid(), type: "ability", agent: curAgent.id, slot: curAbility.slot, team };
  const a = d.start, moved = dist(a, P) >= TAP || d.pts.length > 2;
  if (sh.kind === "line") {
    const b = fitLine(a, moved ? P : [a[0] + 0.06, a[1]], { fixed: (sh.fixed || 0) * unit, max: (sh.max || 0) * unit });
    return { ...base, u: a[0], v: a[1], u2: +b[0].toFixed(4), v2: +b[1].toFixed(4) };
  }
  if (sh.kind === "path") {
    if (!moved) return final ? { ...base, u: a[0], v: a[1], u2: +(a[0] + 0.06).toFixed(4), v2: a[1] } : null;
    let pts = clampPath(d.pts.concat([P]), (sh.max || 0) * unit);
    if (final) pts = finishPts(pts);
    if (pts.length < 2) return null;
    return { ...base, pts, u: pts[0][0], v: pts[0][1], u2: pts[pts.length - 1][0], v2: pts[pts.length - 1][1] };
  }
  // 아이콘·원: 던지기 — 떨어지는 곳은 요원 사거리 안으로(fitRange)
  if (!moved) return final ? fitRange({ ...base, u: a[0], v: a[1] }) : null;
  let pts = d.pts.concat([P]);
  if (final) pts = finishPts(pts);
  const it = { ...base, u: pts[0][0], v: pts[0][1], u2: pts[pts.length - 1][0], v2: pts[pts.length - 1][1] };
  if (pts.length > 2) it.pts = pts.map((p) => p.slice());
  return fitRange(it);
}

// ---------------------------------------------------------------- 저장 · 올리기
function status(t) { $("status").textContent = t; }
function localState() { return { title, side, scenes }; }
function liveText() {
  const others = who.length + viewers - 1;
  if (!CAN_EDIT) return others > 0 ? `🟢 실시간 · ${others + 1}명이 보는 중` : "🟢 실시간";
  return others > 0 ? `🟢 실시간 저장 · ${others + 1}명이 보는 중` : "🟢 자동 저장됨";
}
function changed() {
  dirty = true;
  clearTimeout(saveTimer);
  if (wsOk) saveTimer = setTimeout(flushLive, 120);
  else if (OWNER) { status("저장 대기 중…"); saveTimer = setTimeout(save, 2500); }
  else status("⚠️ 연결이 끊겼어요 — 다시 이어지면 반영돼요");
}
// 화면 상태와 서버가 아는 상태(synced)의 차이를 연산으로 보내요.
function flushLive() {
  clearTimeout(saveTimer);
  if (!wsOk || !CAN_EDIT || !synced) return false;
  const now = localState();
  const ops = diffState(synced, now);
  for (let i = 0; i < ops.length; i += 60) {
    const batch = { t: "ops", n: ++seq, ops: ops.slice(i, i + 60) };
    unacked.push(batch); wsSend(batch);
  }
  if (ops.length) synced = clone(now);
  dirty = false; status(liveText());
  return true;
}
// 💾 저장: 실시간으로 이어져 있으면 바로 보내고, 끊겨 있으면(만든 사람만) 통째로 저장해요.
async function save() {
  clearTimeout(saveTimer);
  if (wsOk) return flushLive();
  if (!OWNER) { status("⚠️ 연결이 끊겼어요 — 다시 이어지면 반영돼요"); return false; }
  const body = { title, data: { side, scenes } };
  status("저장 중…");
  try {
    await getJSON(`/api/board/e/${encodeURIComponent(KEY)}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    dirty = false; unacked = []; synced = clone(localState()); confirmed = clone(synced);
    status(`저장됨${new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}`);
    return true;
  } catch (e) {
    status("⚠️ 저장 실패: " + e.message);
    if (!wsOk) saveTimer = setTimeout(save, 5000);
    return false;
  }
}
async function ownerPost(path, busyText, btn) {
  $(btn).disabled = true;
  try {
    if (wsOk) { flushLive(); for (let i = 0; i < 30 && unacked.length; i++) await sleep(100); }   // 서버가 받을 때까지
    else if (dirty) { await sleep(1100); if (!(await save())) return; }
    status(busyText);
    const j = await getJSON(`/api/board/e/${encodeURIComponent(KEY)}/${path}`, { method: "POST" });
    status((path === "post" ? "📤 " : "👥 ") + (j.message || "했어요"));
  } catch (e) {
    status("⚠️ " + e.message);
  } finally {
    setTimeout(() => { $(btn).disabled = false; }, 3000);
  }
}
function postToDiscord() {
  if (!scenes.some((s) => s.items.length)) { status("빈 작전판이에요 — 먼저 그려 주세요"); return; }
  ownerPost("post", "그림을 만들어 올리는 중…", "post");
}
function inviteLive() { ownerPost("invite", "초대 글을 올리는 중…", "invite"); }

// ---------------------------------------------------------------- 👥 실시간
function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function connect() {
  if (wsDead || !("WebSocket" in window)) return;
  let sock;
  try { sock = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${TAIL}`); }
  catch { retry(); return; }
  ws = sock;
  sock.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } onMsg(m); };
  sock.onclose = (e) => {
    if (ws !== sock) return;
    const was = wsOk; wsOk = false; ws = null; who = []; viewers = 0; cursors.clear(); drawCursors(); renderWho();
    if (was) lostAt = Date.now();
    if (e.code === 4404) { wsDead = true; status("⚠️ 지워진 작전판이에요"); return; }
    if (was) status("⚠️ 연결이 끊겼어요 — 다시 잇는 중…");
    if (dirty && OWNER) { clearTimeout(saveTimer); saveTimer = setTimeout(save, 2500); }   // 끊긴 동안은 통째 저장
    retry();
  };
}
function retry() { wsTry++; setTimeout(connect, Math.min(30000, 800 * 2 ** Math.min(wsTry, 6))); }
function remember() { return { sid: scenes[cur] && scenes[cur].sid, sel: selected >= 0 && items()[selected] ? items()[selected].id : null }; }
function restore(k) {
  const i = scenes.findIndex((s) => s.sid === k.sid);
  cur = i >= 0 ? i : Math.max(0, Math.min(cur, scenes.length - 1));
  selected = k.sel ? items().findIndex((it) => it.id === k.sel) : -1;
}
function onMsg(m) {
  if (m.t === "init") onInit(m);
  else if (m.t === "ops") onRemote(m.ops || []);
  else if (m.t === "ack") {       // 서버가 내 묶음을 적용했어요 → 서버 상태(confirmed)에도 같은 차례에 적용
    const i = unacked.findIndex((b) => b.n === m.n);
    if (i >= 0) {
      const b = unacked.splice(i, 1)[0], now = Date.now();
      if (confirmed) applyOps(confirmed, b.ops);
      recent.push({ at: now, ops: b.ops }); recent = recent.filter((r) => now - r.at < 8000);
    }
  }
  else if (m.t === "nadd") {
    if (m.note && !notes.some((n) => n.id === m.note.id)) notes.push(m.note);
    if (m.note && m.note.by !== myBy) status(`💬 ${m.note.name}님이 피드백을 남겼어요`);
    renderScenes(); render();
  } else if (m.t === "ndel") { notes = notes.filter((n) => n.id !== m.id); if (focusedNote === m.id) focusedNote = null; renderScenes(); render(); }
  else if (m.t === "who") { who = m.list || []; viewers = m.viewers || 0; renderWho(); if (!dirty) status(liveText()); }
  else if (m.t === "bye") { cursors.delete(m.c); drawCursors(); }
  else if (m.t === "cur") { cursors.set(m.c, { u: m.u, v: m.v, at: Date.now() }); drawCursors(); }
  else if (m.t === "ping") showPing(m.u, m.v, m.c);
  else if (m.t === "at") {
    const i = scenes.findIndex((s) => s.sid === m.sid);
    if ($("opt-follow").checked && i >= 0 && i !== cur && !drag) gotoScene(i, true);
  } else if (m.t === "err") status("⚠️ " + (m.message || "오류"));
}
// 처음 이어졌거나 다시 이어졌을 때: 서버 상태를 받고, 아직 못 보낸 내 변경을 그 위에 다시 얹어요.
// reset = 서버가 내 연산을 거절했거나(개수 한도 등) 남이 통째로 저장함 → 내 것을 버리고 서버 상태로.
function onInit(m) {
  me = m.me || null; if (me && me.by) myBy = me.by;
  who = m.who || []; viewers = m.viewers || 0; notes = m.notes || [];
  const data = m.data || {};
  const srv = { title: m.title || "", side: data.side || "atk", scenes: loadScenes(data.scenes) };
  let pending = [];
  if (CAN_EDIT && synced && !m.reset) {
    for (const r of recent) if (r.at >= lostAt - 5000) pending.push(...r.ops);   // 끊기기 직전 5초에 확인받은 것
    for (const b of unacked) pending.push(...b.ops);
    pending.push(...diffState(synced, localState()));
  }
  unacked = []; recent = []; stale = false; undoStack = [];
  if (drag && drag.kind !== "pan") { drag = null; $("g-preview").innerHTML = ""; }
  const keep = remember();
  const st = applyOps(clone(srv), pending);
  scenes = st.scenes; side = st.side; setTitle(st.title, document.activeElement !== $("title") || !!m.reset);
  if (CAN_EDIT) { synced = clone(srv); confirmed = clone(srv); }
  restore(keep);
  wsOk = true; wsTry = 0; dirty = false;
  if (CAN_EDIT) flushLive();
  updateSide(); renderWho(); renderScenes(); render();
  status(m.reset ? "⚠️ 판을 서버 내용으로 다시 맞췄어요" : liveText());
}
// 남이 바꾼 것(ops)이 왔어요. 서버 상태(confirmed)에는 바로 적용하고, 화면은 그 위에 내 것을 다시 쌓아요(rebase).
// 끄는 중(그리기·옮기기)에는 화면을 건드리지 않고 표시만 해 뒀다가(stale) 손을 떼면 맞춰요.
function onRemote(ops) {
  if (!ops.length) return;
  for (const s of undoStack) applyOps(s, ops);        // 되돌려도 남의 것은 안 사라지게
  if (!CAN_EDIT || !confirmed) {                       // 보기·피드백: 보낼 게 없으니 그대로 적용
    const keep = remember(), st = localState();
    applyOps(st, ops);
    shown(st, keep); return;
  }
  applyOps(confirmed, ops);
  if (drag && drag.kind !== "pan") { stale = true; return; }
  rebaseNow();
}
function rebaseNow() {
  stale = false;
  const keep = remember(), sent = [];
  for (const b of unacked) sent.push(...b.ops);
  const r = rebase(confirmed, sent, synced, localState());
  synced = r.synced; scenes = r.local.scenes;
  shown(r.local, keep);
}
function shown(st, keep) {
  side = st.side; if (st.title !== title) setTitle(st.title, false);
  const sids = new Set(scenes.map((s) => s.sid)); notes = notes.filter((n) => sids.has(n.sid));
  restore(keep); updateSide(); renderScenes(); render();
}
function drainRemote() { if (stale) rebaseNow(); }

function renderWho() {
  const box = $("who"); box.innerHTML = "";
  if (who.length + viewers < 2) return;      // 혼자면 안 보여요
  for (const p of who) {
    const c = document.createElement("span"); c.className = "chip";
    const dot = document.createElement("i"); dot.style.background = p.color;
    const nm = document.createElement("span");
    nm.textContent = p.name + (me && p.c === me.c ? " (나)" : "") + (p.role === "f" ? " · 피드백" : "");
    c.append(dot, nm); box.appendChild(c);
  }
  if (viewers) { const c = document.createElement("span"); c.className = "chip"; c.textContent = `👀 ${viewers}`; box.appendChild(c); }
}
const personOf = (c) => who.find((p) => p.c === c) || { name: "", color: "#fff" };
function sendCursor(P) {
  if (!wsOk || !CAN_NOTE || who.length + viewers < 2) return;
  const now = Date.now();
  if (now - lastCur < 150) return;
  lastCur = now; wsSend({ t: "cur", u: P[0], v: P[1] });
}
function drawCursors() {
  const g = $("g-cursors");
  for (const n of [...g.querySelectorAll("[data-c]")]) n.remove();
  for (const [c, v] of cursors) {
    const p = personOf(c);
    const grp = el("g", { "data-c": c }, g);
    el("circle", { cx: X(v.u), cy: Y(v.v), r: 6, fill: p.color, stroke: "#000", "stroke-width": 2 }, grp);
    if (p.name) label(grp, X(v.u) + 10, Y(v.v) + 5, p.name, 14).setAttribute("fill", p.color);
  }
}
function showPing(u, v, c) {
  const g = $("g-cursors"), p = c == null ? (me || { name: "", color: "#f5c518" }) : personOf(c);
  const grp = el("g", {}, g);
  el("circle", { cx: X(u), cy: Y(v), r: 70, fill: "none", stroke: p.color, "stroke-width": 8, class: "ping" }, grp);
  el("circle", { cx: X(u), cy: Y(v), r: 7, fill: p.color, stroke: "#000", "stroke-width": 2 }, grp);
  if (p.name) label(grp, X(u) + 12, Y(v) - 10, p.name, 15);
  setTimeout(() => grp.remove(), 1500);
}
function sendPing(P) {
  showPing(P[0], P[1], null);
  if (wsOk) wsSend({ t: "ping", u: P[0], v: P[1] });
}

$("opt-callout").onchange = drawCallouts;
$("opt-notes").onchange = render;
main();
</script>
</body>
